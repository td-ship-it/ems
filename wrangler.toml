# Cloudflare Worker + Static Assets
# "name" phải TRÙNG tên Worker đã tạo trên Cloudflare Dashboard.
name = "ems"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Giữ các biến đặt trên Dashboard khi deploy lại
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api", "/api/"]

[observability]
enabled = true

# GAS_URL và GAS_KEY KHÔNG đặt ở đây — khai báo trong Cloudflare Dashboard
# (Worker → Settings → Variables and Secrets, chọn loại Secret) hoặc file .dev.vars khi chạy local.
